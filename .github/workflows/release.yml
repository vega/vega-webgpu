name: Release

# Push a tag like v2.0.0 (matching package.json's version) to:
#  1. build and attach the bundles to a GitHub Release
#  2. publish to npm through trusted publishing, so no npm token is stored
#
# The site's page and table row for the version come with the release pull
# request that npm run release opens, so nothing here pushes to main. The tag
# comes from npm run release:tag once that pull request is merged.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      # to start pages.yml, see the last step
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve version and notes from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NOTES="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          # pages.yml keeps the run recorded at this tag's commit under the version
          echo "gallery=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/gallery/?run=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag v${{ steps.meta.outputs.version }} does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.meta.outputs.version }}
          body: |
            ${{ steps.meta.outputs.notes }}

            [Render gallery for this release](${{ steps.meta.outputs.gallery }}), every case as this version drew it.
          # a version with a suffix is an rc, and must not read as the latest stable
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          files: |
            build/vega-webgpu-renderer.js
            build/vega-webgpu-renderer.min.js
            build/vega-webgpu-renderer.module.js

      # npmjs.com trusts this workflow file as the package's publisher, so npm
      # exchanges the job's OIDC token (id-token: write above) for a one-time
      # publish token. That needs npm 11.5.1 or later, which Node 24 ships.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # An rc under the default tag becomes what `npm install` gives you.
          case "$VERSION" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      # The pages run the merge started only keeps its gallery as the release's
      # if the tag was there before it finished. When the tag came later, this
      # run records main again, and if main is still the tagged commit, keeps it.
      - name: Keep the gallery for this release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
