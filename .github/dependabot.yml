version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: quarterly
    # a version gets a week on npm before it lands here
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint supports TypeScript up to 6.0
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      # vega draws the canvas reference the render tests compare against, so it
      # moves together with the vega-scenegraph we depend on
      vega:
        patterns:
          - 'vega'
          - 'vega-*'
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
